[package]
name = "p2p_app"
version = "0.1.0"
edition = "2024" # don't change this back to 2021!
default-run = "p2p_chat_tui"

[lib]
crate-type = ["cdylib", "rlib"]

[lints.rust]
# flutter_rust_bridge's attribute macros expand code containing cfg(frb_expand)
# into this crate; declaring it here stops unexpected_cfgs warnings.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

[lints.clippy]
# UM, ACTUALLY
pedantic = { level = "deny", priority = -1 }
# DEVELOPING LINTS
nursery = { level = "deny", priority = -1 }
# DENY PANICS
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"

[profile.release]
## https://github.com/johnthagen/min-sized-rust
strip = true      # Strip symbols from binary
opt-level = 'z'   # Optimize for size
lto = 'fat'       # Enable fat link-time optimization
codegen-units = 1 # Reduce parallel codegen units to increase optimizations
panic = 'abort'   # Abort on panic
overflow-checks = false # Disable runtime integer overflow checks

[profile.release-with-debug]
inherits = "release"
debug = true
strip = false
panic = 'unwind'

[features]
default = [ "mdns", "tracing", "quic", "tui" ]
basic = [ "dep:libp2p" ]
mdns = [ "dep:libp2p", "libp2p/mdns" ]
sqlite_bundled = [ "dep:libp2p", "dep:libsqlite3-sys" ]
quic = [ "dep:libp2p", "dep:libp2p-quic" ]
tracing = [ "dep:libp2p", "dep:tracing", "dep:tracing-subscriber", "tracing-subscriber/env-filter" ]
tui = [ "dep:ratatui", "dep:ratatui-textarea", "dep:crossterm" ]
dioxus = [ "dep:dioxus" ]
dioxus-desktop = [ "dioxus", "dep:dioxus-desktop", "dioxus/desktop", "dep:futures-channel" ]
mobile = [ "basic", "sqlite_bundled", "quic", "flutter_rust_bridge" ]
test-utils = []

[dependencies]
libp2p-quic = { version = "=0.13.1", optional = true }
tracing = { version = "=0.1.44", optional = true }
tracing-subscriber = { version = "=0.3.23", optional = true }
ratatui = { version = "=0.30.2", optional = true }
ratatui-textarea = { version = "0.9", optional = true, default-features = false, features = ["crossterm"] }
crossterm = { version = "=0.29", optional = true }
dioxus = { version = "=0.7.10", optional = true }
dioxus-desktop = { version = "=0.7.10", optional = true }
futures-channel = { version = "0.3", optional = true }
# ORM mapper we use to access our SQLite database
diesel = { version = "^2.3", features = ["sqlite", "returning_clauses_for_sqlite_3_35", "chrono" ] }
# feature "chrono" used for TIMESTAMP columns
# by default we dynamically link to SQLite installed in your system.
# to instead bundle SQLite, you could uncomment the next line:
libsqlite3-sys = { version = "0.36.0", features = ["bundled"], optional = true }
#libsqlite3-sys = "0.35.0"

# for embedding the migration sql scripts and update the database found during runtime to reflect the expected structure
diesel_migrations = { version = "^2.3" }

# feature set copied from chat example
libp2p = { version = "=0.56.0", features = [
    "tokio",
    "gossipsub",
    "noise",
    "macros",
    "tcp",
    "yamux",
    "quic",
    "request-response",
    "serde",
    "json",
    "ping",
], optional = true }

libp2p-request-response = { version = "0.29", features = ["json"] }

# FFI bridge for Flutter mobile app
flutter_rust_bridge = { version = "=2.12.0", optional = true }

# async runtime also used for libp2p
tokio = { version = "1.53.1", features = [ "macros", "rt-multi-thread", "io-util", "io-std" ] }
# features needed for tokio::main macro: "rt-core" & "macros"
# feature "io-util" is used for AsyncBufReadExt
# feature "io-std" gives us io::stdin()

# libp2p uses tracing crate to log events - subscriber can help to debug issues
# enable with "tracing" feature

# nice error handing
color-eyre ={ version = "=0.6.5" }
chrono = { version = "0.4.45", features = ["clock"] }
libp2p-identity = "0.2.14"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
petname = "3.0"
unicode-width = "0.2"

[dev-dependencies]
tempfile = "3"
serial_test = "3"
diesel = { version = "^2.3", features = ["sqlite", "returning_clauses_for_sqlite_3_35", "chrono" ] }

[[bin]]
name = "p2p_chat"
path = "src/bin/p2p_chat.rs"

[[bin]]
name = "p2p_chat_tui"
path = "src/bin/p2p_chat_tui.rs"
required-features = ["tui"]

[[bin]]
name = "p2p_chat_dioxus"
path = "src/bin/p2p_chat_dioxus.rs"
required-features = ["dioxus-desktop"]

# [patch.crates-io]
# rustls-webpki = { version = ">=0.103.13" }
