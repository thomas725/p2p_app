[package]
name = "p2p_app"
version = "0.1.0"
edition = "2024" # don't change this back to 2021!
default-run = "p2p_chat_tui"

[lib]
crate-type = ["cdylib", "rlib"]

[lints.rust]
# flutter_rust_bridge's attribute macros expand code containing cfg(frb_expand)
# into this crate; declaring it here stops unexpected_cfgs warnings.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

[lints.clippy]
# UM, ACTUALLY
pedantic = { level = "deny", priority = -1 }
# DEVELOPING LINTS
nursery = { level = "deny", priority = -1 }
# DENY PANICS
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"

[profile.release]
## https://github.com/johnthagen/min-sized-rust
strip = true      # Strip symbols from binary
opt-level = 'z'   # Optimize for size
lto = 'fat'       # Enable fat link-time optimization
codegen-units = 1 # Reduce parallel codegen units to increase optimizations
panic = 'abort'   # Abort on panic
overflow-checks = false # Disable runtime integer overflow checks

[profile.release-with-debug]
inherits = "release"
debug = true
strip = false
panic = 'unwind'

[features]
default = [ "mdns", "tracing", "quic", "tui", "attachment-gc", "web" ]
basic = [ "dep:libp2p" ]
mdns = [ "dep:libp2p", "libp2p/mdns" ]
sqlite_bundled = [ "dep:libp2p", "dep:libsqlite3-sys" ]
quic = [ "dep:libp2p" ]
tracing = [ "dep:libp2p", "dep:tracing", "dep:tracing-subscriber", "tracing-subscriber/env-filter" ]
tui = [ "dep:ratatui", "dep:ratatui-textarea", "dep:crossterm" ]
mobile = [ "basic", "sqlite_bundled", "quic", "flutter_rust_bridge", "attachment-gc" ]
test-utils = []
calls = []
# Blob lifecycle (files lane §12): on-by-default switch for attachment GC —
# remove stale `.part` partials (incomplete pulls) and orphaned blobs/rows
# ("overwritten"/superseded attachments). Disable to never delete blob state:
# `--no-default-features --features <the rest you need>`.
attachment-gc = []
# Web frontend (docs/web_frontend.md): axum HTTP+WebSocket server that
# mirrors the FRB API surface so a Flutter-Web (or any) client can drive the node
# remotely. Server binary `p2p_chat_server` requires it; the `mobile` feature set
# deliberately excludes it. The server republishes the `mobile`/FRB surface
# (`crate::api`, `crate::mobile_api`, `crate::mobile_node`), so `web` implies
# `mobile` — otherwise the default feature set (which includes `web`) would not
# compile.
web = [
    "dep:axum",
    "dep:tower-http",
    "tokio/signal",
    "dep:futures-util",
    "mobile",
]

[dependencies]
tracing = { version = "=0.1.44", optional = true }
tracing-subscriber = { version = "=0.3.23", optional = true }
ratatui = { version = "=0.30.2", optional = true }
ratatui-textarea = { version = "0.9", optional = true, default-features = false, features = ["crossterm"] }
crossterm = { version = "=0.29", optional = true }
# ORM mapper we use to access our SQLite database
diesel = { version = "^2.3", features = ["sqlite", "returning_clauses_for_sqlite_3_35", "chrono" ] }
# feature "chrono" used for TIMESTAMP columns
# by default we dynamically link to SQLite installed in your system.
# to instead bundle SQLite, you could uncomment the next line:
libsqlite3-sys = { version = "0.38", features = ["bundled"], optional = true }
#libsqlite3-sys = "0.35.0"

# for embedding the migration sql scripts and update the database found during runtime to reflect the expected structure
diesel_migrations = { version = "^2.3" }

# safe f64 -> integer conversions (ToPrimitive) for timestamp formatting
# without `as` casts; already in the tree via libp2p/gossipsub.
num-traits = "0.2"

# feature set copied from chat example
libp2p = { version = "=0.57.1", features = [
    "tokio",
    "gossipsub",
    "noise",
    "macros",
    "tcp",
    "yamux",
    "quic",
    "request-response",
    "serde",
    "json",
    "cbor",
    "ping",
], optional = true }

# FFI bridge for Flutter mobile app
flutter_rust_bridge = { version = "=2.13.0", optional = true }

# async runtime also used for libp2p
tokio = { version = "1.53.1", features = [ "macros", "rt-multi-thread", "io-util", "io-std" ] }
# features needed for tokio::main macro: "rt-core" & "macros"
# feature "io-util" is used for AsyncBufReadExt
# feature "io-std" gives us io::stdin()

# libp2p uses tracing crate to log events - subscriber can help to debug issues
# enable with "tracing" feature

# nice error handing
color-eyre ={ version = "=0.6.5" }
chrono = { version = "0.4.45", features = ["clock"] }
libp2p-identity = "=0.3.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
petname = "3.0"
unicode-width = "0.2"
# SHA-256 hashing for content-addressed file attachments (files lane §12): the
# `file_id` of every attachment is the hex digest of its bytes, so storage is
# deduplicated and transfer integrity is verified on finalize.
sha2 = "0.10"

# Web frontend server (feature `web`): JSON-over-WebSocket mirror of the FRB
# surface + attachment upload/download routes + static serving of the Flutter
# web build.
axum = { version = "0.8", optional = true, features = ["ws", "json", "query", "tokio", "http1", "macros"] }
tower-http = { version = "0.7", optional = true, features = ["cors", "fs"] }
# Stream/Sink combinators for splitting the axum WebSocket in the web server.
futures-util = { version = "0.3", optional = true }

[dev-dependencies]
tempfile = "3"
serial_test = "4"
# Web-server tests: a WebSocket client for the end-to-end frame-protocol test
# and Router::oneshot for the HTTP routes. Both are already in the tree via
# axum (same versions), so this adds no new dependency surface.
#
# Keep tokio-tungstenite in lockstep with axum's `ws` feature: axum pulls
# tokio-tungstenite 0.29 -> tungstenite 0.29, and bumping this test-only client
# to 0.30 would compile a SECOND tungstenite tree (plus sha1 0.11 and rand 0.10)
# for no behavioural gain. Revisit when axum moves.
tower = { version = "0.5", features = ["util"] }
tokio-tungstenite = "0.29"

[[bin]]
name = "p2p_chat"
path = "src/bin/p2p_chat.rs"

[[bin]]
name = "p2p_chat_tui"
path = "src/bin/p2p_chat_tui.rs"
required-features = ["tui"]

[[bin]]
name = "p2p_chat_server"
path = "src/bin/p2p_chat_server.rs"
required-features = ["web"]

