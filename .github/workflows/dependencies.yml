name: Dependency Updates

on:
  schedule:
    # Check for updates daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  # Needed to push the dedicated ci-results results branch (never main).
  contents: write
  # actions: read lets the skip-check query this workflow's own run history
  # (scripts/ci-skip-no-new-commits.sh); without it the token gets a 403 and the
  # check would otherwise silently run on every schedule.
  actions: read

concurrency:
  group: dependencies
  cancel-in-progress: true

jobs:
  check-dependencies:
    name: Check Dependency Updates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.2

      # Skip the heavy tasks (outdated/audit scans) when nothing new landed on the
      # default branch since this workflow last succeeded. Commits authored by the
      # CI pipeline itself are ignored, so the nightly metrics push to main does
      # not count as new work. Manual workflow_dispatch always forces a full run.
      - name: Check for new human commits since last run
        id: skip-check
        run: scripts/ci-skip-no-new-commits.sh dependencies.yml

      - name: Install Rust toolchain
        if: steps.skip-check.outputs.skip != 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust cache
        if: steps.skip-check.outputs.skip != 'true'
        uses: Swatinem/rust-cache@v2

      - name: Create results directory
        if: steps.skip-check.outputs.skip != 'true'
        run: mkdir -p .github/ci-results

      # Informational only. cargo outdated exits non-zero whenever any row exists
      # (including transitive pin rows that no repo change can move), so it must NOT
      # gate the workflow. See docs/2026-09-02_backlog.md item 6 for the expected rows.
      - name: Check for outdated dependencies
        if: steps.skip-check.outputs.skip != 'true'
        continue-on-error: true
        run: |
          cargo install cargo-outdated --locked 2>&1 | tee .github/ci-results/outdated-install.log || true
          cargo outdated 2>&1 | tee .github/ci-results/outdated.log
          echo "Exit code: $?" >> .github/ci-results/outdated.log

      # HARD GATE: fail the workflow on any advisory not ignored in .cargo/audit.toml.
      # cargo audit is currently clean (exit 0), so this turns on without going red.
      - name: Check for security vulnerabilities
        if: steps.skip-check.outputs.skip != 'true'
        run: |
          cargo install cargo-audit --locked 2>&1 | tee .github/ci-results/audit-install.log || true
          cargo audit 2>&1 | tee .github/ci-results/audit.log

      # Push results to a dedicated `ci-results` branch (never `main`). Force-push makes it a
      # rolling "latest run" record; this branch is auto-generated, so overwriting it is safe.
      # Auth comes from actions/checkout's persisted credentials on the `origin` remote.
      - name: Push dependency check results to ci-results branch
        if: always() && steps.skip-check.outputs.skip != 'true'
        run: |
          set -e
          BRANCH=ci-results
          ./scripts/push-ci-results.sh "$BRANCH"
