name: Metrics & Coverage

on:
  schedule:
    # Refresh coverage + codebase metrics nightly.
    - cron: '30 2 * * *'
  workflow_dispatch:

permissions:
  # contents: needed to push the coverage/metrics commit to main.
  # actions: read lets the skip-check query this workflow's own run history
  # (scripts/ci-skip-no-new-commits.sh); without it the token gets a 403 and the
  # check would otherwise silently run on every schedule.
  contents: write
  actions: read

concurrency:
  group: metrics
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  metrics:
    name: Coverage & Codebase Metrics
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      # Skip the heavy tasks (tarpaulin + Flutter + Kotlin coverage, ~13 min) when
      # nothing new landed on the default branch since this workflow last succeeded.
      # Commits authored by the CI pipeline itself are ignored, so our own metrics
      # push to main does not count as new work. Manual workflow_dispatch always
      # forces a full run.
      - name: Check for new human commits since last run
        id: skip-check
        run: scripts/ci-skip-no-new-commits.sh metrics.yml

      - name: Install Rust toolchain
        if: steps.skip-check.outputs.skip != 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Setup Rust cache
        if: steps.skip-check.outputs.skip != 'true'
        uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        if: steps.skip-check.outputs.skip != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libsqlite3-dev \
            pkg-config

      # ============================================================
      # Phase 1: Coverage (Rust + Dart + Kotlin)
      # ============================================================

      - name: Install cargo-tarpaulin
        if: steps.skip-check.outputs.skip != 'true'
        run: |
          cargo install cargo-tarpaulin 2>&1 | tee .github/ci-logs/coverage-install.log || true
        continue-on-error: true

      - name: Setup Flutter
        if: steps.skip-check.outputs.skip != 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
        continue-on-error: true

      - name: Run Rust code coverage analysis
        if: steps.skip-check.outputs.skip != 'true'
        env:
          CARGO_BUILD_JOBS: 2
        run: |
          set +e
          cargo tarpaulin --all-features -o Json 2>&1 | tee .github/ci-logs/tarpaulin-output.log
          TARPAULIN_EXIT=${PIPESTATUS[0]}
          if [ "$TARPAULIN_EXIT" -ne 0 ]; then
            rm -f tarpaulin-report.json
          fi
          set -e
          echo "Exit code: $TARPAULIN_EXIT" >> .github/ci-logs/tarpaulin-output.log
          exit $TARPAULIN_EXIT
        continue-on-error: true

      - name: Run Dart tests with coverage
        if: steps.skip-check.outputs.skip != 'true'
        run: |
          set +e
          flutter test --coverage 2>&1 | tee .github/ci-logs/dart-coverage.log
          DART_EXIT=${PIPESTATUS[0]}
          set -e
          echo "Exit code: $DART_EXIT" >> .github/ci-logs/dart-coverage.log
          exit $DART_EXIT
        working-directory: apps/flutter_app
        continue-on-error: true

      - name: Run Kotlin tests with coverage
        if: steps.skip-check.outputs.skip != 'true'
        run: |
          set +e
          ./gradlew :app:testDebugUnitTest :app:testDebugUnitTestJacocoReport \
            --no-daemon 2>&1 | tee .github/ci-logs/kotlin-coverage.log
          KOTLIN_EXIT=${PIPESTATUS[0]}
          set -e
          echo "Exit code: $KOTLIN_EXIT" >> .github/ci-logs/kotlin-coverage.log
          exit $KOTLIN_EXIT
        working-directory: apps/flutter_app/android
        continue-on-error: true

      - name: Generate codebase metrics
        if: steps.skip-check.outputs.skip != 'true'
        run: |
          set +e
          COVERAGE_FLAGS=""
          [ -f tarpaulin-report.json ] && COVERAGE_FLAGS="$COVERAGE_FLAGS --with-coverage"
          [ -f apps/flutter_app/coverage/lcov.info ] && COVERAGE_FLAGS="$COVERAGE_FLAGS --dart-coverage"
          [ -f apps/flutter_app/build/reports/jacoco/testDebugUnitTest/jacocoTestReport.xml ] && COVERAGE_FLAGS="$COVERAGE_FLAGS --kotlin-coverage"
          python3 scripts/generate_metrics.py $COVERAGE_FLAGS > docs/codebase_metrics.tmp
          METRICS_EXIT=$?
          set -e
          if [ "$METRICS_EXIT" -eq 0 ] && [ -s docs/codebase_metrics.tmp ]; then
            mv docs/codebase_metrics.tmp docs/codebase_metrics.md
          else
            rm -f docs/codebase_metrics.tmp
          fi
          echo "Metrics generation exit code: $METRICS_EXIT"
          exit $METRICS_EXIT
        continue-on-error: true

      # ============================================================
      # Phase 2: Commit Coverage + Metrics to main
      # ============================================================

      - name: Commit coverage and metrics to main
        if: always() && steps.skip-check.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          # Work in a detached worktree of origin/main so we never disturb the
          # runner's primary checkout (which holds the generated coverage files).
          WORKTREE="$(mktemp -d)"
          trap 'rm -rf "$WORKTREE"' EXIT

          git fetch -q origin main
          git worktree add --detach "$WORKTREE" origin/main
          cd "$WORKTREE"

          # Carry over the artifacts generated in the primary checkout.
          for f in docs/codebase_metrics.md \
                   tarpaulin-report.json \
                   apps/flutter_app/coverage/lcov.info \
                   apps/flutter_app/build/reports/jacoco/testDebugUnitTest/jacocoTestReport.xml; do
            if [ -f "$OLDPWD/$f" ]; then
              mkdir -p "$(dirname "$f")"
              cp "$OLDPWD/$f" "$f"
            fi
          done

          git config user.email "ci-pipeline@users.noreply.github.com"
          git config user.name "CI Pipeline"

          # Redundancy guard: if origin/main already ends with a CI metrics commit
          # and no human commits landed since the SHA this run measured, a
          # duplicate/re-delivered schedule event is about to push a second
          # "ci: refresh" commit with no new work behind it. Skip the push (and
          # the run ends success); the artifacts have already been produced.
          # The skip-check normally catches this earlier; this is defense in depth.
          # --no-walk is required so the author/grep match applies to origin/main
          # itself, not to the latest matching ancestor.
          if git log -1 --no-walk origin/main --format=%H \
               --author="ci-pipeline@users.noreply.github.com" \
               --grep="ci: refresh coverage and codebase metrics" | grep -q .; then
            new_human="$(git rev-list "$GITHUB_SHA"..origin/main 2>/dev/null \
              | while read -r c; do git show -s --format=%ae "$c"; done \
              | grep -vc '^ci-pipeline@users.noreply.github.com$' || true)"
            if [ "${new_human:-0}" -eq 0 ]; then
              echo "origin/main already ends in a CI metrics commit with no new human commits; skipping duplicate push."
              exit 0
            fi
          fi

          git add docs/codebase_metrics.md 2>/dev/null || true
          [ -f tarpaulin-report.json ] && git add tarpaulin-report.json 2>/dev/null || true
          [ -f apps/flutter_app/coverage/lcov.info ] && git add apps/flutter_app/coverage/lcov.info 2>/dev/null || true
          [ -f apps/flutter_app/build/reports/jacoco/testDebugUnitTest/jacocoTestReport.xml ] && git add apps/flutter_app/build/reports/jacoco/testDebugUnitTest/jacocoTestReport.xml 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No metrics/coverage changes to commit."
            exit 0
          fi

          git commit -q -m "ci: refresh coverage and codebase metrics"

          # Non-force push to main; retry on the transient non-fast-forward that a
          # concurrent push can cause (rebase onto the fresh tip each attempt).
          for attempt in 1 2 3; do
            if git push -q origin HEAD:refs/heads/main 2>&1; then
              echo "Pushed metrics/coverage to main (attempt $attempt)."
              exit 0
            fi
            sleep 5
            git fetch -q origin main
            git rebase -q origin/main
          done
          echo "Failed to push metrics/coverage to main after retries."
          exit 1