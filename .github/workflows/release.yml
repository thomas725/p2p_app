name: Release Builds

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., v0.1.0) — published as a release'
        required: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 1

jobs:
  # Resolves the tag the release is published under and validates it before any
  # build machine is spent. A tag push uses its own ref; a manual dispatch must
  # supply `tag` (the input used to be declared but never read, so dispatching
  # built artifacts that no release ever referenced).
  prepare:
    name: Resolve release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - name: Resolve and validate the tag
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            tag="$INPUT_TAG"
            if [ -z "$tag" ]; then
              echo "::error::workflow_dispatch requires the 'tag' input (e.g. v0.1.0)"
              exit 1
            fi
          else
            tag="${REF#refs/tags/}"
          fi
          if ! printf '%s' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$'; then
            echo "::error::release tag '$tag' must look like v1.2.3 (optionally -rc1)"
            exit 1
          fi
          echo "Publishing release $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build-release:
    name: Build Release (${{ matrix.target }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            binary_name: p2p_chat_tui
            build_cmd: cargo build --release --target x86_64-unknown-linux-gnu
          - target: x86_64-apple-darwin
            os: macos-latest
            binary_name: p2p_chat_tui
            build_cmd: cargo build --release --target x86_64-apple-darwin
          - target: aarch64-apple-darwin
            os: macos-latest
            binary_name: p2p_chat_tui
            build_cmd: cargo build --release --target aarch64-apple-darwin
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            binary_name: p2p_chat_tui
            build_cmd: cargo build --release --target aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
      
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
          cache-all-crates: true
          save-if: true
      
      - name: Install system dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev pkg-config build-essential
      
      - name: Install cross (for ARM targets)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: cargo install cross --locked
      
      - name: Build with cross (ARM)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        env:
          CROSS_CONTAINER_IN_CONTAINER: true
        run: cross build --release --target aarch64-unknown-linux-gnu
      
      - name: Build (non-ARM)
        if: matrix.target != 'aarch64-unknown-linux-gnu'
        run: ${{ matrix.build_cmd }}
      
      - name: Strip binary (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: strip target/${{ matrix.target }}/release/${{ matrix.binary_name }}
      
      - name: Create checksums
        run: |
          cd target/${{ matrix.target }}/release
          # Every matrix job produces a binary called `p2p_chat_tui`. Publish
          # it under a target-qualified name so the platform builds cannot
          # overwrite each other, and checksum that name so `sha256sum -c`
          # matches the file that is actually released.
          cp ${{ matrix.binary_name }} ${{ matrix.binary_name }}-${{ matrix.target }}
          sha256sum ${{ matrix.binary_name }}-${{ matrix.target }} > ${{ matrix.binary_name }}-${{ matrix.target }}.sha256
          cat ${{ matrix.binary_name }}-${{ matrix.target }}.sha256
      
      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}-release
          path: |
            target/${{ matrix.target }}/release/${{ matrix.binary_name }}-${{ matrix.target }}
            target/${{ matrix.target }}/release/${{ matrix.binary_name }}-${{ matrix.target }}.sha256
          retention-days: 30

  create-release:
    name: Create Release
    # The minimal job must finish too: `download-artifact` only sees artifacts
    # that have already been uploaded, so without this `needs` the minimal
    # `p2p_chat` binary raced the release and was usually missing from it.
    needs: [prepare, build-release, build-minimal-release]
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
      
      - name: Prepare release files
        run: |
          mkdir -p release-files
          # Every artifact directory holds files that are already named for
          # the platform they came from (p2p_chat_tui-<target>) plus the
          # minimal headless build, so a flat copy cannot collide. Copy the
          # checksums too: each one names the file it belongs to, so
          # `sha256sum -c` works on a downloaded release.
          for dir in release-artifacts/*/; do
            for f in "$dir"*; do
              [ -f "$f" ] || continue
              cp "$f" release-files/
            done
          done
          # actions/upload-artifact does not preserve file modes (every file
          # comes back 644), so restore the executable bit on the binaries.
          # Checksums are unaffected: sha256sum hashes content, not permissions.
          find release-files -type f ! -name '*.sha256' -exec chmod +x {} +
          ls -la release-files/
      
      - name: Get release notes from CHANGELOG
        id: release-notes
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          if [ -f CHANGELOG.md ]; then
            # Extract release notes for the resolved tag (not $GITHUB_REF: on a
            # manual dispatch that is a branch ref, not a tag).
            sed -n "/^## \[$TAG\]/,/^## \[/p" CHANGELOG.md | sed '$d' > RELEASE_NOTES.txt || echo "Release of $TAG" > RELEASE_NOTES.txt
          else
            echo "Release of $TAG" > RELEASE_NOTES.txt
          fi
          cat RELEASE_NOTES.txt
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          files: release-files/*
          body_path: RELEASE_NOTES.txt
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-minimal-release:
    name: Build Minimal Release (Embedded Linux)
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: dtolnay/rust-toolchain@stable
      
      - uses: Swatinem/rust-cache@v2
        with:
          key: minimal-release
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev pkg-config
      
      - name: Build minimal binary
        # `p2p_chat_tui` and `p2p_chat_server` declare required-features, so
        # without `tui`/`web` this builds only the headless `p2p_chat` CLI.
        run: cargo build --release --no-default-features --features basic,mdns,sqlite_bundled
      
      - name: Create checksums
        run: |
          cd target/release
          sha256sum p2p_chat > p2p_chat.minimal.sha256
          cat p2p_chat.minimal.sha256
      
      - name: Upload minimal artifact
        uses: actions/upload-artifact@v4
        with:
          name: minimal-release
          path: |
            target/release/p2p_chat
            target/release/p2p_chat.minimal.sha256
          retention-days: 30
