name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]

permissions:
  contents: write
  checks: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  pipeline:
    name: Complete CI/CD Pipeline
    runs-on: ubuntu-latest
    
    steps:
      # ============================================================
      # Setup: Checkout & Install Toolchain
      # ============================================================
      
      - name: Checkout code
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
      
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      
      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
      
      # ============================================================
      # System Dependencies (once for entire pipeline)
      # ============================================================
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libsqlite3-dev \
            pkg-config
      
      # ============================================================
      # Create logs directory
      # ============================================================
      
      - name: Create logs directory
        run: mkdir -p .github/ci-logs
      
      # ============================================================
      # PHASE 1: Code Quality Checks
      # ============================================================
      
      - name: Check code formatting
        run: |
          set +e
          cargo fmt -- --check 2>&1 | tee .github/ci-logs/fmt.log
          FMT_EXIT=$?
          set -e
          echo "Exit code: $FMT_EXIT" >> .github/ci-logs/fmt.log
          exit $FMT_EXIT
        continue-on-error: true
      
      - name: Run clippy lints
        run: |
          set +e
          cargo clippy --all-targets --all-features 2>&1 | tee .github/ci-logs/clippy.log
          CLIPPY_EXIT=$?
          set -e
          echo "Exit code: $CLIPPY_EXIT" >> .github/ci-logs/clippy.log
          exit $CLIPPY_EXIT
        continue-on-error: true
      
      # ============================================================
      # PHASE 2: Test + Build (once)
      # ============================================================

      - name: Run test suite
        run: |
          set +e
          cargo test --all-features 2>&1 | tee .github/ci-logs/test.log
          TEST_EXIT=$?
          set -e
          echo "Exit code: $TEST_EXIT" >> .github/ci-logs/test.log
          exit $TEST_EXIT
        continue-on-error: true

      - name: Build project
        run: |
          set +e
          cargo build --release --all-features 2>&1 | tee .github/ci-logs/build.log
          BUILD_EXIT=$?
          set -e
          echo "Exit code: $BUILD_EXIT" >> .github/ci-logs/build.log
          exit $BUILD_EXIT
        continue-on-error: true

      # The minimal headless CLI (shipped by nightly-desktop.yml) builds with a
      # reduced feature set, so it is the check that catches cfg-gating breaks
      # the all-features build cannot see (e.g. a `#[cfg(feature = "kad")]` fn
      # called from an ungated arm, or code assuming the `tracing` feature).
      - name: Build minimal feature set
        run: |
          set +e
          cargo build --no-default-features --features basic,mdns,sqlite_bundled 2>&1 | tee .github/ci-logs/minimal.log
          MINIMAL_EXIT=$?
          set -e
          echo "Exit code: $MINIMAL_EXIT" >> .github/ci-logs/minimal.log
          exit $MINIMAL_EXIT
        continue-on-error: true
      
      # ============================================================
      # PHASE 3: Security & Documentation
      # ============================================================
      
      - name: Security audit
        run: |
          cargo install cargo-audit
          set +e
          cargo audit 2>&1 | tee .github/ci-logs/audit.log
          AUDIT_EXIT=$?
          set -e
          echo "Exit code: $AUDIT_EXIT" >> .github/ci-logs/audit.log
          exit $AUDIT_EXIT
        continue-on-error: true
      
      - name: Check documentation links
        run: |
          set +e
          python3 scripts/check_docs_links.py 2>&1 | tee .github/ci-logs/doclinks.log
          DOCLINKS_EXIT=$?
          set -e
          echo "Exit code: $DOCLINKS_EXIT" >> .github/ci-logs/doclinks.log
          exit $DOCLINKS_EXIT
        continue-on-error: true

      - name: Build documentation
        run: |
          set +e
          cargo doc --no-deps --all-features 2>&1 | tee .github/ci-logs/docs.log
          DOCS_EXIT=$?
          set -e
          echo "Exit code: $DOCS_EXIT" >> .github/ci-logs/docs.log
          exit $DOCS_EXIT
        env:
          RUSTDOCFLAGS: "-W missing-docs"
        continue-on-error: true
      
      # ============================================================
      # FINAL PHASE: Store Results
      # ============================================================
      
      - name: Create comprehensive results file
        if: always()
        run: |
          mkdir -p .github/ci-results
          TIMESTAMP=$(date -u +%Y-%m-%d_%H-%M-%S)
          RESULTS_FILE=".github/ci-results/results_${TIMESTAMP}_${{ github.run_id }}.txt"
          SUMMARY_FILE=".github/ci-results/summary.txt"

          # Every check above appends its own `Exit code: N` to its log. Collect
          # those here so the report leads with a verdict instead of making the
          # reader grep ~2k lines of output for the outcome.
          CHECKS=(fmt clippy test build minimal audit doclinks docs)
          declare -A EXIT_CODES STATUS
          FAILED=0
          for name in "${CHECKS[@]}"; do
            log=".github/ci-logs/${name}.log"
            code="?"
            if [ -f "$log" ]; then
              code=$(grep -o 'Exit code: [0-9][0-9]*' "$log" | tail -n 1 | awk '{print $3}')
              [ -n "$code" ] || code="?"
            fi
            EXIT_CODES[$name]="$code"
            if [ "$code" = "0" ]; then
              STATUS[$name]="PASS"
            else
              STATUS[$name]="FAIL (exit $code)"
              FAILED=$((FAILED + 1))
            fi
          done

          print_summary() {
            echo "============================================================"
            echo "SUMMARY"
            echo "============================================================"
            printf '%-10s %-5s %s\n' "check" "exit" "result"
            for name in "${CHECKS[@]}"; do
              printf '%-10s %-5s %s\n' "$name" "${EXIT_CODES[$name]}" "${STATUS[$name]}"
            done
            if [ "$FAILED" -eq 0 ]; then
              echo "overall: PASS (${#CHECKS[@]}/${#CHECKS[@]} checks green)"
            else
              echo "overall: FAIL (${FAILED}/${#CHECKS[@]} checks failed)"
            fi
            echo "============================================================"
          }

          # Fixed-name copy so an agent can read the latest verdict without
          # listing timestamped files (and the final step below reads it).
          print_summary > "$SUMMARY_FILE"

          append_log() {
            local name="$1"
            local f=".github/ci-logs/${name}.log"
            if [ -f "$f" ]; then
              echo "--- $name [${STATUS[$name]}] ---" >> "$RESULTS_FILE"
              cat "$f" >> "$RESULTS_FILE"
              echo "" >> "$RESULTS_FILE"
            fi
          }

          phase_header() {
            echo "" >> "$RESULTS_FILE"
            echo "============================================================" >> "$RESULTS_FILE"
            echo "$1" >> "$RESULTS_FILE"
            echo "============================================================" >> "$RESULTS_FILE"
            echo "" >> "$RESULTS_FILE"
          }

          {
            echo "============================================================"
            echo "CI/CD Pipeline Results"
            echo "============================================================"
            echo ""
            echo "Timestamp: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "Commit: ${{ github.sha }}"
            echo "Branch: ${{ github.ref }}"
            echo "Run ID: ${{ github.run_id }}"
            echo ""
            print_summary
            echo ""
            echo "============================================================"
            echo "Detailed Logs"
            echo "============================================================"
            echo ""
          } > "$RESULTS_FILE"

          phase_header "Phase 1 - Code Quality"
          append_log fmt
          append_log clippy

          phase_header "Phase 2 - Test & Build"
          append_log test
          append_log build
          append_log minimal

          phase_header "Phase 3 - Security & Documentation"
          append_log audit
          append_log doclinks
          append_log docs

          echo "Results file created at: $RESULTS_FILE"
          cat "$SUMMARY_FILE"
      
      - name: Clean up individual log files
        if: always()
        run: |
          # Delete individual log files (consolidated into results file)
          rm -rf .github/ci-logs
          echo "Individual log files deleted (consolidated into results file)"
      
      # Push the pipeline results to the dedicated `ci-results` branch (never `main`).
      # Coverage + codebase metrics now live in the separate Metrics & Coverage workflow
      # (metrics.yml), which pushes those artifacts to main on a timer.
      - name: Push pipeline results to ci-results branch
        if: always()
        run: |
          set -e
          ./scripts/push-ci-results.sh

      # Report-then-fail: every check above stays `continue-on-error` so a single
      # push always yields a COMPLETE report (a hard failure would skip the later
      # checks), and the results are already pushed to `ci-results` before this
      # step runs. This last step only turns the run red, so a failing check is
      # visible in the Actions list too — it does not block a push.
      - name: Fail the run if any check failed
        if: always()
        run: |
          if [ ! -f .github/ci-results/summary.txt ]; then
            echo "::error::CI summary missing; treating the run as failed"
            exit 1
          fi
          cat .github/ci-results/summary.txt
          if grep -q '^overall: FAIL' .github/ci-results/summary.txt; then
            echo "::error::one or more CI checks failed (summary above; full log on the ci-results branch)"
            exit 1
          fi
          echo "All CI checks passed."
