name: Nightly APK

# Build a Flutter Android APK and publish it as a rolling "nightly" GitHub
# release so it can be downloaded directly from the repo.
#
# Scheduled runs skip the build when no new human-authored commits have landed
# on the default branch since this workflow last succeeded (nothing new to ship
# today). The check goes through scripts/ci-skip-no-new-commits.sh, which
# ignores CI-authored commits (e.g. the metrics/coverage push to main) and is
# FAIL-CLOSED when the GitHub API cannot be queried. Manual runs via
# "Run workflow" always build.
on:
  schedule:
    # Nightly at 03:17 UTC.
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  # contents: needed to publish the GitHub release + tag.
  # actions: read lets the skip-check query this workflow's own run history
  # (scripts/ci-skip-no-new-commits.sh); without it the token gets a 403 and
  # the check would otherwise run on every schedule.
  contents: write
  actions: read

concurrency:
  # Never build two nightlies from the same commit (e.g. a manual dispatch racing
  # the cron): a later run cancels the earlier one.
  group: nightly-apk
  cancel-in-progress: true

env:
  NDK_VERSION: "29.0.14206865"

jobs:
  build-apk:
    name: Build Flutter Android APK (nightly)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Skip the ~25 min build when nothing new landed on the default branch
      # since this workflow last succeeded. Commits authored by the CI pipeline
      # itself are ignored, so the metrics/coverage push to main does not count
      # as new work. Manual workflow_dispatch always forces a full run. The
      # script is FAIL-CLOSED: any API error results in skip=true.
      #
      # Note: the previous inline check compared HEAD against
      # `gh release view nightly-latest --json targetCommitish`, which GitHub
      # stores as the branch NAME ("main"), not the commit SHA — so it could
      # never match a 40-char HEAD and the build ran every night, piling up
      # nightly tags on the latest commit.
      - name: Check for new human commits since last run
        id: skip-check
        run: scripts/ci-skip-no-new-commits.sh nightly-apk.yml

      - name: Set up JDK 17
        if: steps.skip-check.outputs.skip != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK and NDK
        if: steps.skip-check.outputs.skip != 'true'
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            platform-tools
            platforms;android-34
            platforms;android-35
            build-tools;34.0.0
            build-tools;35.0.0
            ndk;29.0.14206865

      - name: Accept Android licenses
        if: steps.skip-check.outputs.skip != 'true'
        run: yes | sdkmanager --licenses || true
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}

      - name: Set up Rust
        if: steps.skip-check.outputs.skip != 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Rust cache
        if: steps.skip-check.outputs.skip != 'true'
        uses: Swatinem/rust-cache@v2

      - name: Set up Flutter
        if: steps.skip-check.outputs.skip != 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        if: steps.skip-check.outputs.skip != 'true'
        working-directory: apps/flutter_app
        run: flutter pub get

      - name: Build Rust native library (Android)
        if: steps.skip-check.outputs.skip != 'true'
        run: bash apps/flutter_app/build_rust_android.sh

      - name: Build APK
        if: steps.skip-check.outputs.skip != 'true'
        working-directory: apps/flutter_app
        run: flutter build apk --release

      - name: Prepare artifact
        if: steps.skip-check.outputs.skip != 'true'
        run: |
          cd apps/flutter_app/build/app/outputs/flutter-apk
          cp app-release.apk p2p_app.apk
          sha256sum p2p_app.apk > p2p_app.apk.sha256
          ls -la

      - name: Set nightly tag
        if: steps.skip-check.outputs.skip != 'true'
        id: tag
        run: echo "tag=nightly-$(date -u +%Y%m%d-%H%M%S)" >> "$GITHUB_OUTPUT"

      - name: Publish nightly release
        if: steps.skip-check.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Nightly APK (${{ steps.tag.outputs.tag }})
          prerelease: true
          make_latest: false
          files: |
            apps/flutter_app/build/app/outputs/flutter-apk/p2p_app.apk
            apps/flutter_app/build/app/outputs/flutter-apk/p2p_app.apk.sha256
          body: |
            Automated nightly APK build from `${{ github.sha }}` (${{ github.ref_name }}).
            Built at ${{ github.event.repository.updated_at }}.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prune old nightly releases (keep last 15)
        if: steps.skip-check.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Collect nightly tags (excluding the stable "nightly-latest" pointer),
          # newest first (tag format is date-sortable).
          mapfile -t TAGS < <(gh release list --limit 100 --json tagName \
            --jq '.[] | select((.tagName | startswith("nightly-")) and .tagName != "nightly-latest") | .tagName' | sort -r)
          echo "Found ${#TAGS[@]} nightly release(s)"
          if [ "${#TAGS[@]}" -gt 15 ]; then
            for t in "${TAGS[@]:15}"; do
              echo "Deleting old nightly release: $t"
              gh release delete "$t" --yes || true
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/$t" || true
            done
          fi

      - name: Publish latest nightly pointer
        if: steps.skip-check.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly-latest
          name: Nightly APK (latest)
          prerelease: true
          make_latest: false
          overwrite: true
          files: |
            apps/flutter_app/build/app/outputs/flutter-apk/p2p_app.apk
            apps/flutter_app/build/app/outputs/flutter-apk/p2p_app.apk.sha256
          body: |
            Always points at the most recent nightly build (`${{ github.sha }}`).
            For earlier builds (up to 15 retained), see the other `nightly-*` releases.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}